name: Security & Supply Chain Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan every Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  codeql-cpp-python:
    name: CodeQL Static Security Analysis (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["cpp", "python"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install C++23 toolchain and WPILib native libraries (for C++ CodeQL)
        if: matrix.language == 'cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build cmake
          python -m venv .venv
          .venv/bin/pip install --pre "wpilib==2027.0.0a6" nanobind

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build C++ Target for CodeQL
        if: matrix.language == 'cpp'
        run: |
          cmake --preset linux-release -DPython_EXECUTABLE=$PWD/.venv/bin/python -DCPY6107_BUILD_PYTHON=OFF -DCPY6107_BUILD_TESTS=OFF
          cmake --build --preset linux-release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review (PRs)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  python-vuln-audit:
    name: Python Vulnerability Audit (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pip-audit & scan dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --desc

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
