name: Lint & Static Analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-lint:
    name: Python Lint & Typecheck (Ruff + Mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov

      - name: Run Ruff linter
        run: ruff check python tests/python scripts examples

      - name: Run Ruff formatter check
        run: ruff format --check python tests/python scripts examples

      - name: Run Mypy strict type checks
        run: mypy --ignore-missing-imports python/cpy6107 tests/python

  cpp-lint:
    name: C++23 Format & Clang-Tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install LLVM 19 (clang-format & clang-tidy) and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-19 clang-tidy-19 g++-14 ninja-build cmake

      - name: Check C++ formatting (clang-format)
        run: |
          find include src bindings tests -type f \( -name "*.cpp" -o -name "*.hpp" \) | xargs clang-format-19 --dry-run --Werror

      - name: Configure CMake for compile_commands.json
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --pre "wpilib==2027.0.0a6"
          cmake --preset linux-debug -DCPY6107_BUILD_PYTHON=OFF

      - name: Run clang-tidy
        run: |
          find src tests/cpp -type f -name "*.cpp" | xargs clang-tidy-19 -p build/linux-debug
