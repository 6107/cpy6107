[build-system]
requires = [
    "scikit-build-core>=0.10.0",
    "nanobind>=2.4.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "cpy6107"
version = "0.1.0"
description = "C++23 TimedCommandRobot with a settable loop watchdog for FRC 2027 (robotpy), via nanobind"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "wpilib==2027.0.0a6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "gcovr>=8.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
]

[tool.scikit-build]
wheel.packages = ["python/cpy6107"]
cmake.version = ">=3.28"
cmake.build-type = "Release"
cmake.define.CPY6107_BUILD_TESTS = "OFF"
cmake.define.CPY6107_BUILD_FRAMEWORK = "ON"
cmake.define.CPY6107_BUILD_PYTHON = "ON"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra -q --strict-markers --cov=cpy6107 --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["cpy6107"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["python", "tests/python"]
extend-exclude = ["python/cpy6107/_cpy6107.pyi", "docs"] # stub is generated by nanobind stubgen

[tool.ruff.lint.per-file-ignores]
"tests/python/*" = ["N802"] # hook names mirror the camelCase robotpy API

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "python"
packages = ["cpy6107"]

[tool.cibuildwheel]
build = "cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux*"
test-requires = ["pytest"]
test-command = "pytest {project}/tests/python"

[tool.cibuildwheel.linux]
before-all = "dnf install -y gcc-toolset-14-gcc-c++ || apt-get update && apt-get install -y g++-14"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["universal2"]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
