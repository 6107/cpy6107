[build-system]
requires = [
    "scikit-build-core>=0.10.0",
    "nanobind>=2.4.0",
    # Headers/libraries come from the robotpy-native wheels; keep identical to [project] below.
    "wpilib==2027.0.0a8",
]
build-backend = "scikit_build_core.build"

[project]
name = "cpy6107"
version = "2027.0.0a8.post2" # <WPILib version>.postN; see docs/RELEASING.md
description = "C++23 TimedCommandRobot with a settable loop watchdog for FRC 2027 (robotpy), via nanobind"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Jemison CyberJagzz (FRC Team 6107)" }]
keywords = ["frc", "robotpy", "wpilib", "robotics", "watchdog", "nanobind"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "wpilib==2027.0.0a8",
]

[project.urls]
Homepage = "https://github.com/6107/cpy6107"
Documentation = "https://github.com/6107/cpy6107/blob/main/docs/USER-GUIDE.md"
Issues = "https://github.com/6107/cpy6107/issues"
Changelog = "https://github.com/6107/cpy6107/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "gcovr>=8.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
]

[tool.uv]
# robotpy/WPILib 2027 releases are alphas; let uv resolve them (pip needs --pre).
prerelease = "allow"

[tool.scikit-build]
wheel.packages = ["python/cpy6107"]
cmake.version = ">=3.28"
cmake.build-type = "Release"
cmake.define.CPY6107_BUILD_TESTS = "OFF"
cmake.define.CPY6107_BUILD_FRAMEWORK = "ON"
cmake.define.CPY6107_BUILD_PYTHON = "ON"
sdist.include = ["cmake", "include", "src", "bindings", "python", "LICENSE", "README.md"]
sdist.exclude = [".github", "docs", "tests", "docker", "scripts", "build*", ".venv", "dist", ".vscode", ".pytest_cache", ".clang-*", ".dockerignore", ".gitignore", "AGENTS.md", "CMakePresets.json"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra -q --strict-markers --cov=cpy6107 --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["cpy6107"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["python", "tests/python"]
extend-exclude = ["python/cpy6107/_cpy6107.pyi", "docs"] # stub is generated by nanobind stubgen

[tool.ruff.lint.per-file-ignores]
"tests/python/*" = ["N802"] # hook names mirror the camelCase robotpy API

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "python"
packages = ["cpy6107"]
